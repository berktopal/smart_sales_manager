name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Show test/compile failures
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && grep -qE "FAILURE|ERROR" "$f" && echo "::error title=$(basename "$f")::$(head -c 4000 "$f" | sed ':a;N;$!ba;s/\n/%0A/g')"
          done
          true
